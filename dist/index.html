<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ichimai</title>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one screen. Top half is the folding stage (canvas + step panel), bottom half scrolls the catalog. */
:root {
  --bg: #f3f2ee;        /* shironeri, unbleached silk */
  --stage: #fbfaf7;
  --panel: #f7f6f2;
  --ink: #23211e;       /* sumi */
  --ink-2: #625e57;
  --ink-3: #96918a;
  --line: #e0ddd5;
  --chip: #ebe9e3;
  --accent: #2c4c70;    /* ai-iro indigo */
  --accent-ink: #ffffff;
  --accent-soft: #e2e8ef;
  --seal: #b5412d;      /* shu, used for the seal and mountain folds */
  --valley: #2c4c70;
  --mountain: #b5412d;
  --edge: rgba(20, 18, 15, .5);
  --shadow: rgba(40, 32, 20, .16);
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --stage: #1d1c1a; --panel: #1a1917; --ink: #ebe8e1; --ink-2: #aba69d; --ink-3: #78746d;
    --line: #2f2d29; --chip: #262522; --accent: #a4bddb; --accent-ink: #12161b; --accent-soft: #24303d;
    --seal: #d4664f; --valley: #a4bddb; --mountain: #e27e64; --edge: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --stage: #1d1c1a; --panel: #1a1917; --ink: #ebe8e1; --ink-2: #aba69d; --ink-3: #78746d;
  --line: #2f2d29; --chip: #262522; --accent: #a4bddb; --accent-ink: #12161b; --accent-soft: #24303d;
  --seal: #d4664f; --valley: #a4bddb; --mountain: #e27e64; --edge: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1.1fr) minmax(0, .9fr); }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
.seal { width: 30px; height: 30px; border-radius: 4px; background: var(--seal); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1; flex: none; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: .02em; }
.brand span { font-family: var(--display); color: var(--ink-3); font-size: 14px; }
.tagline { color: var(--ink-2); font-size: 13px; margin-left: auto; }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); min-height: 0; border-bottom: 1px solid var(--line); background: var(--stage); }
.canvas { position: relative; min-height: 0; min-width: 0; }
#stage-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.paper { filter: drop-shadow(0 2px 3px var(--shadow)); }
.facet { stroke: none; }
.edge { stroke: var(--edge); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.crease { stroke: rgba(0, 0, 0, .28); stroke-width: .8; vector-effect: non-scaling-stroke; }
.gline { stroke-width: 1.8; vector-effect: non-scaling-stroke; fill: none; stroke-linecap: round; }
.gline.valley { stroke: var(--valley); stroke-dasharray: 9 6; }
.gline.mountain { stroke: var(--mountain); stroke-dasharray: 12 4 2 4; }
.abody { fill: none; stroke: var(--ink); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.ahead { fill: var(--ink); stroke: var(--ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.ahead.open { fill: var(--stage); }

.stage-title { position: absolute; top: 14px; left: 20px; display: flex; align-items: baseline; gap: 10px; pointer-events: none; }
.stage-title h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.stage-title span { font-family: var(--display); color: var(--ink-3); font-size: 15px; }
.legend { position: absolute; top: 16px; right: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); pointer-events: none; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend svg { width: 34px; height: 6px; overflow: visible; }
.pill { position: absolute; left: 20px; bottom: 14px; padding: 3px 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); letter-spacing: .03em; white-space: nowrap; }
.pill:empty { display: none; }

/* step panel */
.panel { border-left: 1px solid var(--line); background: var(--panel); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
.p-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 19px; }
.p-head p { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 4px; background: var(--chip); font-size: 12.5px; color: var(--ink-2); }
.sw { width: 11px; height: 11px; border-radius: 2px; border: 1px solid rgba(0, 0, 0, .25); margin-right: -3px; }
.sw + .sw { margin-right: 0; }
.lvl { display: inline-flex; gap: 2px; }
.lvl i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--ink-2); }
.lvl[data-l="1"] i:nth-child(-n+1), .lvl[data-l="2"] i:nth-child(-n+2), .lvl[data-l="3"] i { background: var(--ink-2); }

.stepline { display: flex; align-items: baseline; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.stepline .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.stepline .num { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stepline .of { color: var(--ink-3); font-size: 15px; font-variant-numeric: tabular-nums; }
.instr { margin: 0; font-size: 16px; line-height: 1.6; min-height: 3.2em; max-width: 40ch; }

.btn { position: relative; display: inline-flex; align-items: baseline; justify-content: center; gap: 7px; height: 40px; padding: 0 4px; border: 0; border-radius: 0; background: none; cursor: pointer; font-family: var(--display); font-size: 15px; font-weight: 500; color: var(--ink-2); line-height: 40px; white-space: nowrap; }
.btn::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 7px; height: 1px; background: currentColor; transform: scaleX(0); transition: transform .25s ease; }
.btn:hover:not(:disabled) { color: var(--ink); }
.btn:hover:not(:disabled)::after { transform: scaleX(1); }
.btn:disabled { color: var(--ink-3); opacity: .55; cursor: default; }
.btn.primary { color: var(--ink); font-weight: 600; }
.btn.primary::after { transform: scaleX(1); background: var(--ink); }
.btn svg { width: 13px; height: 13px; flex: none; align-self: center; }
.btn small { font-family: var(--display); font-size: 11.5px; font-weight: 500; color: var(--ink-3); }

/* transport bar under the animation */
.viewer { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.viewer .canvas { flex: 1 1 auto; }
.transport { flex: none; border-top: 1px solid var(--line); background: var(--panel); }
.anim { height: 3px; background: var(--line); overflow: hidden; }
#anim-fill { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
.tbar { display: flex; align-items: center; gap: 22px; padding: 6px 20px; }
.steps { display: flex; gap: 4px; flex: 1 1 auto; justify-content: center; flex-wrap: wrap; min-width: 0; }
.sn { position: relative; width: 28px; height: 34px; border: 0; background: none; cursor: pointer; padding: 0; font-family: var(--display); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.sn::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; background: var(--ink); transform: scaleX(0); transition: transform .2s ease; }
.sn:hover { color: var(--ink); }
.sn.past { color: var(--ink-2); }
.sn[aria-current="step"] { color: var(--ink); font-weight: 700; }
.sn[aria-current="step"]::after { transform: scaleX(1); }
.steps { flex-wrap: nowrap; align-items: center; }
.pg { width: 26px; height: 34px; border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--display); font-size: 17px; line-height: 30px; color: var(--ink-3); }
.pg:hover:not(:disabled) { color: var(--ink); }
.pg:disabled { opacity: .3; cursor: default; }
.pg-gap { width: 6px; flex: none; }
#next.ready svg { animation: drift 1.8s ease-in-out infinite; }
@keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
.toggles { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { appearance: none; width: 13px; height: 13px; border: 1px solid var(--ink-3); border-radius: 0; background: none; position: relative; cursor: pointer; margin: 0; }
.toggle input::after { content: ""; position: absolute; inset: 2px; background: var(--ink); transform: scale(0); transition: transform .15s; }
.toggle input:checked { border-color: var(--ink); }
.toggle input:checked::after { transform: scale(1); }
.toggle:has(input:checked) { color: var(--ink); }
.keys { font-size: 12px; color: var(--ink-3); margin-top: auto; }
kbd { font-family: var(--body); font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; background: var(--bg); color: var(--ink-2); }

/* catalog */
.catalog { overflow: auto; min-height: 0; }
.catalog-inner { max-width: 1240px; margin: 0 auto; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 16px; }
.toolbar { display: flex; flex-direction: column; gap: 12px; }
.search { position: relative; display: block; max-width: 520px; }
.search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--ink-3); }
#q { width: 100%; height: 42px; padding: 0 12px 0 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); font: inherit; font-size: 15px; }
#q::placeholder { color: var(--ink-3); }
#filters { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.fgroup { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.flabel { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 13.5px; }
.chip small { color: var(--ink-3); font-size: 11.5px; }
.chip .cnt { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip:hover:not(:disabled) { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] small, .chip[aria-pressed="true"] .cnt { color: inherit; opacity: .7; }
.chip:disabled { opacity: .4; cursor: default; }
.results-head { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
#count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--stage); cursor: pointer; overflow: hidden; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.thumb { display: block; aspect-ratio: 4 / 3; max-width: 100%; padding: 14px; }
.thumb svg { width: 100%; height: 100%; display: block; }
.card-body { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--panel); }
.card-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.cname { font-family: var(--display); font-weight: 600; font-size: 16px; }
.cjp { font-family: var(--display); color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
.card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: 12px; color: var(--ink-2); }
.card-meta .sep { color: var(--ink-3); }
.two { margin-left: 2px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--seal); color: var(--seal); font-size: 11px; }
.empty { padding: 30px 0; color: var(--ink-2); }

@media (max-width: 820px) {
  .app { grid-template-rows: auto minmax(0, 1.35fr) minmax(0, .65fr); }
  .top { padding: 8px 16px; }
  .tagline { display: none; }
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding: 10px 16px 12px; gap: 8px; overflow: visible; }
  .p-head, .meta, .keys { display: none; }
  .stepline { border-top: 0; padding-top: 0; }
  .stepline .num { font-size: 24px; }
  .instr { font-size: 14.5px; min-height: 0; max-width: none; }
  .stage-title { left: 16px; top: 10px; }
  .stage-title h1 { font-size: 18px; }
  .legend { right: 12px; top: auto; bottom: 10px; font-size: 11px; }
  .pill { left: 16px; bottom: 10px; }
  .tbar { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; padding: 8px 16px; }
  .steps { grid-column: 1 / -1; grid-row: 1; }
  .sn { width: 26px; height: 30px; font-size: 14px; }
  .btn small { display: none; }
  .catalog-inner { padding: 14px 16px 32px; }
  #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .toggle input, .toggle input::after { transition: none; }
  #next.ready svg { animation: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="seal" aria-hidden="true">折</div>
    <div class="brand"><b>Ichimai</b><span lang="ja">一枚</span></div>
    <div class="tagline">One sheet, folded step by step</div>
  </header>

  <section class="stage" aria-label="Folding instructions">
    <div class="viewer">
    <div class="canvas">
      <svg id="stage-svg" viewBox="-150 -150 300 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="m-name">
        <g class="paper" id="stage-paper"></g>
        <g id="stage-guides"></g>
      </svg>
      <div class="stage-title"><h1 id="m-name">Dog Face</h1><span id="m-jp" lang="ja"></span></div>
      <div class="legend" aria-hidden="true">
        <div><svg viewBox="0 0 34 6"><line x1="0" y1="3" x2="34" y2="3" class="gline valley"/></svg>Valley fold</div>
        <div><svg viewBox="0 0 34 6"><line x1="0" y1="3" x2="34" y2="3" class="gline mountain"/></svg>Mountain fold</div>
      </div>
      <div class="pill" id="pill" aria-live="polite"></div>
    </div>
    <nav class="transport" aria-label="Step controls">
      <div class="anim" aria-hidden="true"><span id="anim-fill"></span></div>
      <div class="tbar">
        <button type="button" class="btn" id="prev" title="Previous step (←)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg><span class="lbl">Previous</span><small lang="ja">戻る</small></button>
        <button type="button" class="btn" id="replay" title="Replay this step (R)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg><span>Replay step</span><small lang="ja">もう一度</small></button>
        <div class="steps" id="dots" role="group" aria-label="Jump to step"></div>
        <button type="button" class="btn primary" id="next" title="Next step (→)"><span id="next-lbl">Next step</span><small lang="ja">次へ</small><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
      </div>
    </nav>
    </div>

    <aside class="panel">
      <div class="p-head">
        <h2 id="p-name"></h2>
        <p id="p-blurb"></p>
      </div>
      <div class="meta" id="p-meta"></div>
      <div class="stepline" aria-live="polite"><span class="label">Step</span><span class="num" id="s-num">1</span><span class="of">of <span id="s-total">1</span></span></div>
      <p class="instr" id="s-text"></p>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="loop">Loop this step</label>
        <label class="toggle"><input type="checkbox" id="slow">Slow motion</label>
      </div>
      <div class="keys"><kbd>←</kbd> <kbd>→</kbd> step · <kbd>R</kbd> replay · <kbd>L</kbd> loop · <kbd>/</kbd> search</div>
    </aside>
  </section>

  <main class="catalog">
    <div class="catalog-inner">
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <input id="q" type="search" placeholder="Search models: helmet, flower, kids, modular…" aria-label="Search models" autocomplete="off">
        </label>
        <div id="filters"></div>
      </div>
      <div class="results-head"><span id="count"></span><button type="button" class="linkbtn" id="clear" hidden>Clear filters</button></div>
      <div id="grid"></div>
      <div class="empty" id="empty" hidden>No models match these filters. <button type="button" class="linkbtn" id="empty-clear">Clear filters</button></div>
    </div>
  </main>
</div>

<script>
/* Fold engine
   Paper is a set of flat convex facets. Each facet keeps its polygon in paper
   coordinates plus an affine matrix (paper -> view). A fold reflects the facets
   on one side of a line; the in-between frames use a partial reflection
   (perpendicular distance scaled by cos θ), which is a projected 3D hinge. */
const Fold = (() => {
  const EPS = 1e-6;
  const BIG = 1e6;

  // SVG-style matrix [a,b,c,d,e,f]: x' = a x + c y + e, y' = b x + d y + f
  const I = [1, 0, 0, 1, 0, 0];
  const mul = (A, B) => [
    A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1],
    A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3],
    A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5],
  ];
  const ap = (M, p) => [M[0] * p[0] + M[2] * p[1] + M[4], M[1] * p[0] + M[3] * p[1] + M[5]];
  const det = (M) => M[0] * M[3] - M[1] * M[2];
  const rot = (deg, cx = 0, cy = 0) => {
    const r = (deg * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
    return [c, s, -s, c, cx - c * cx + s * cy, cy - s * cx - c * cy];
  };
  const scaleX = (k, cx) => [k, 0, 0, 1, cx - k * cx, 0];
  const mirrorX = [-1, 0, 0, 1, 0, 0];

  // Hinge about line p->q at angle θ (θ = π is a full reflection)
  function hinge(p, q, theta) {
    let ux = q[0] - p[0], uy = q[1] - p[1];
    const L = Math.hypot(ux, uy); ux /= L; uy /= L;
    const nx = -uy, ny = ux;
    let k = Math.cos(theta);
    if (Math.abs(k) < 0.004) k = k < 0 ? -0.004 : 0.004; // avoid a singular matrix
    const a = ux * ux + k * nx * nx, b = ux * uy + k * nx * ny, d = uy * uy + k * ny * ny;
    return [a, b, b, d, p[0] - (a * p[0] + b * p[1]), p[1] - (b * p[0] + d * p[1])];
  }
  const reflect = (p, q) => hinge(p, q, Math.PI);
  const cross = (p, q, x) => (q[0] - p[0]) * (x[1] - p[1]) - (q[1] - p[1]) * (x[0] - p[0]);

  function area(poly) {
    let s = 0;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      s += a[0] * b[1] - b[0] * a[1];
    }

      const ended = t >= total;
      const list = ended ? Fold.staticList(cs.after) : Fold.frame(cs, theta);
      const creases = ended || (cs.kind !== 'crease' && theta >= Math.PI) ? cs.after.creases : cs.before.creases;
      body = drawPaper(list, c.model, creases, 's') + drawMarks(cs.step.marks, ended ? 1 : markOp);
    }
    $('#stage-paper').innerHTML = body;
    $('#stage-guides').innerHTML = reduced ? drawGuides(player.guides, 0.85) : drawGuides(player.guides, gOp * 0.95);

    $('#anim-fill').style.transform = `scaleX(${clamp01(t / total).toFixed(4)})`;
    if (t < total) { player.raf = requestAnimationFrame(render); return; }
    player.done = true;
    if (!player.advanced && player.i < player.c.steps.length - 1) $('#next').classList.add('ready');
    if (player.loop && !reduced) {
      if (!player.holdUntil) player.holdUntil = now + 900;
      if (now >= player.holdUntil) { playStep(player.i); return; }
      player.raf = requestAnimationFrame(render);
    }
  }

  function playStep(i) {
    const c = player.c;
    cancelAnimationFrame(player.raf);
    player.i = Math.max(0, Math.min(c.steps.length - 1, i));
    const cs = c.steps[player.i];
    player.fromBox = player.view || padBox(cs.box, cs);
    player.box = padBox(cs.box, cs);
    if (cs.kind === 'note') player.box = [-150, -150, 150, 150];
    player.guides = cs.kind === 'note' ? [] : guidesFor(cs);
    player.done = false;
    player.holdUntil = 0;
    player.t0 = performance.now();
    $('#next').classList.remove('ready');
    updatePanel();
    player.raf = requestAnimationFrame(render);
  }

  function loadModel(id, step = 0) {
    const c = compiled.get(id) || compiled.values().next().value;
    player.c = c;
    player.view = null;
    const m = c.model;
    $('#m-name').textContent = m.name;
    $('#m-jp').textContent = m.jp;
    $('#p-name').textContent = m.name;
    $('#p-blurb').textContent = m.blurb;
    const lv = LEVELS[m.difficulty];
    $('#p-meta').innerHTML = [
      `<span class="tag"><span class="lvl" data-l="${m.difficulty}" aria-hidden="true"><i></i><i></i><i></i></span>${lv[0]}</span>`,
      `<span class="tag">${Fold.SHAPES[m.shape].label}</span>`,
      `<span class="tag"><span class="sw" style="background:${m.colors[0]}"></span><span class="sw" style="background:${m.colors[1]}"></span>${SIDES[m.sides][0]}</span>`,
      m.sheets ? `<span class="tag">${m.sheets} sheets</span>` : '',
    ].join('');
    player.page = 0;
    $$('.card').forEach((el) => el.setAttribute('aria-current', el.dataset.id === m.id ? 'true' : 'false'));
    try { if (location.hash.slice(1) !== m.id) history.replaceState(null, '', '#' + m.id); } catch (e) { /* hash is a convenience */ }
    playStep(step);
  }

  function updatePanel() {
    const c = player.c, n = c.steps.length, cs = c.steps[player.i];
    $('#s-num').textContent = player.i + 1;
    $('#s-total').textContent = n;
    $('#s-text').textContent = cs.step.text;
    $('#pill').textContent = pillText(cs, player.i);
    $('#prev').disabled = player.i === 0;
    $('#next-lbl').textContent = player.i === n - 1 ? 'Start over' : 'Next step';
    player.page = Math.floor(player.i / pageSize());
    renderSteps();
  }

  // Step numbers are shown a page at a time so long models stay on one line
  const narrow = matchMedia('(max-width: 820px)');
  const pageSize = () => (narrow.matches ? 7 : 10);
  function renderSteps() {
    const n = player.c.steps.length, size = pageSize();
    const pages = Math.ceil(n / size);
    player.page = Math.max(0, Math.min(pages - 1, player.page));
    const from = player.page * size, to = Math.min(n, from + size);
    let s = '';
    if (pages > 1) s += `<button type="button" class="pg" data-pg="-1" aria-label="Show steps ${Math.max(1, from - size + 1)}–${from}"${player.page === 0 ? ' disabled' : ''}>‹</button><span class="pg-gap"></span>`;
    for (let k = from; k < to; k++) {
      s += `<button type="button" class="sn${k < player.i ? ' past' : ''}" data-k="${k}" aria-label="Go to step ${k + 1}" aria-current="${k === player.i ? 'step' : 'false'}">${k + 1}</button>`;
    }
    if (pages > 1) s += `<span class="pg-gap"></span><button type="button" class="pg" data-pg="1" aria-label="Show steps ${to + 1}–${Math.min(n, to + size)}"${player.page === pages - 1 ? ' disabled' : ''}>›</button>`;
    $('#dots').innerHTML = s;
  }
  narrow.addEventListener('change', () => { if (player.c) { player.page = Math.floor(player.i / pageSize()); renderSteps(); } });

  /* ---------- catalog ---------- */
  const filters = { difficulty: new Set(), shape: new Set(), sides: new Set(), category: new Set() };
  const groups = [
    ['difficulty', 'Difficulty', Object.entries(LEVELS).map(([k, v]) => [k, v[0], v[1]])],
    ['shape', 'Paper shape', Object.keys(Fold.SHAPES).map((k) => [k, Fold.SHAPES[k].label, ''])],
    ['sides', 'Paper color', Object.entries(SIDES).map(([k, v]) => [k, v[0], v[1]])],
    ['category', 'Category', Object.entries(CATS).map(([k, v]) => [k, v[0], v[1]])],
  ];

  function buildFilters() {
    $('#filters').innerHTML = groups.map(([key, label, opts]) => `
      <div class="fgroup" role="group" aria-label="${label}">
        <span class="flabel">${label}</span>
        <div class="chips">${opts.map(([v, l, sub]) => {
          const count = MODELS.filter((m) => String(m[key]) === v).length;
          return `<button type="button" class="chip" data-key="${key}" data-v="${v}" aria-pressed="false"${count ? '' : ' disabled'}>${l}${sub ? `<small>${sub}</small>` : ''}<span class="cnt">${count}</span></button>`;
        }).join('')}</div>
      </div>`).join('');
  }

  function matchesModel(m, q) {
    for (const [key] of groups) if (filters[key].size && !filters[key].has(String(m[key]))) return false;
    if (!q) return true;
    const hay = [m.name, m.jp, m.blurb, m.keywords, CATS[m.category][0], LEVELS[m.difficulty][0], Fold.SHAPES[m.shape].label].join(' ').toLowerCase();
    return q.split(/\s+/).every((w) => hay.includes(w));
  }

  function buildCards() {
    $('#grid').innerHTML = MODELS.map((m, i) => {
      const c = compiled.get(m.id);
      return `<button type="button" class="card" data-id="${m.id}" aria-current="false">
        <span class="thumb">${thumb(c, i)}</span>
        <span class="card-body">
          <span class="card-title"><span class="cname">${m.name}</span><span class="cjp" lang="ja">${m.jp}</span></span>
          <span class="card-meta">
            <span class="lvl" data-l="${m.difficulty}" title="${LEVELS[m.difficulty][0]}"><i></i><i></i><i></i></span>
            <span>${LEVELS[m.difficulty][0]}</span><span class="sep">·</span>
            <span>${c.steps.length} steps</span><span class="sep">·</span>
            <span>${SHAPES_SHORT[m.shape]}</span>
            ${m.sides === 'two' ? '<span class="two" title="Needs paper colored on both sides">2-sided</span>' : ''}
          </span>
        </span>
      </button>`;
    }).join('');
  }

  function applyFilters() {
    const q = $('#q').value.trim().toLowerCase();
    let n = 0;
    $$('.card').forEach((el) => {
      const ok = matchesModel(MODELS.find((m) => m.id === el.dataset.id), q);
      el.hidden = !ok;
      if (ok) n++;
    });
    const active = q || Object.values(filters).some((s) => s.size);
    $('#count').textContent = `${n} ${n === 1 ? 'model' : 'models'}`;
    $('#clear').hidden = !active;
    $('#empty').hidden = n > 0;
    try { localStorage.setItem('ichimai.filters', JSON.stringify(Object.fromEntries(Object.entries(filters).map(([k, s]) => [k, [...s]])))); } catch (e) { /* optional */ }
  }

  /* ---------- wire up ---------- */
  buildFilters();
  buildCards();
  try {
    const saved = JSON.parse(localStorage.getItem('ichimai.filters') || 'null');
    if (saved) for (const k in saved) if (filters[k]) saved[k].forEach((v) => filters[k].add(v));
  } catch (e) { /* optional */ }
  $$('.chip').forEach((b) => b.setAttribute('aria-pressed', filters[b.dataset.key].has(b.dataset.v)));
  applyFilters();

  $('#filters').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const set = filters[b.dataset.key];
    set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v);
    b.setAttribute('aria-pressed', set.has(b.dataset.v));
    applyFilters();
  });
  $('#q').addEventListener('input', applyFilters);
  const clearAll = () => {
    Object.values(filters).forEach((s) => s.clear());
    $$('.chip').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    $('#q').value = '';
    applyFilters();
  };
  $('#clear').addEventListener('click', clearAll);
  $('#empty-clear').addEventListener('click', clearAll);
  $('#grid').addEventListener('click', (e) => {
    const card = e.target.closest('.card'); if (!card) return;
    loadModel(card.dataset.id);
  });
  $('#dots').addEventListener('click', (e) => {
    const p = e.target.closest('.pg');
    if (p) { player.page += +p.dataset.pg; renderSteps(); $(`#dots .pg[data-pg="${p.dataset.pg}"]`)?.focus(); return; }
    const d = e.target.closest('.sn'); if (d) playStep(+d.dataset.k);
  });
  $('#prev').addEventListener('click', () => playStep(player.i - 1));
  $('#next').addEventListener('click', () => { player.advanced = true; playStep(player.i + 1 < player.c.steps.length ? player.i + 1 : 0); });
  $('#replay').addEventListener('click', () => playStep(player.i));
  $('#loop').addEventListener('change', (e) => { player.loop = e.target.checked; if (player.loop && player.done) playStep(player.i); });
  $('#slow').addEventListener('change', (e) => { player.slow = e.target.checked; });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea') && e.target.type !== 'checkbox') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); player.advanced = true; playStep(player.i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); playStep(player.i - 1); }
    else if (e.key === 'r' || e.key === 'R') playStep(player.i);
    else if (e.key === 'l' || e.key === 'L') { const l = $('#loop'); l.checked = !l.checked; l.dispatchEvent(new Event('change')); }
    else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  });

  const fromHash = location.hash.slice(1);
  loadModel(compiled.has(fromHash) ? fromHash : 'dog-face');
})();

</script>

</body>
</html>
